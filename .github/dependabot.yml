version: 2
updates:
  # Bun workspaces: use the bun ecosystem so Dependabot updates bun.lock
  # alongside package.json. The npm ecosystem only bumps manifests and
  # breaks CI's `bun install --frozen-lockfile` step.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      # Bun only supports dependency-type production|runtime in groups, not
      # development — match dev tools by name instead.
      dev-dependencies:
        patterns:
          - "@types/*"
          - "@astrojs/*"
          - "@vitejs/*"
          - "typescript"
          - "vitest"
          - "vite*"
          - "jsdom"
          - "happy-dom"
    ignore:
      # Major bumps for these need a deliberate upgrade pass. vitest is
      # intentionally *not* ignored: GitHub's npm security updater targets
      # workspace package.json files without a local lockfile and fails with
      # dependency_file_not_supported, so the bun ecosystem here is the path
      # that can actually ship patched majors (e.g. 3.x → 4.1.11+).
      # happy-dom is grouped with vitest below so security patches land together.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite-plugin-dts"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
