name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Production deploys are handled by Vercel (see vercel.json). This workflow
# only verifies code quality. Docs are built here on pull requests so merges
# are validated without duplicating the production build Vercel runs on push.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require Changeset for package changes
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-changeset.mjs

      - name: Build packages
        run: bun run --filter '@kernelui-lib/*' build

      - name: Build registry
        run: bun run --cwd packages/registry build

      - name: Registry consistency check
        run: bun run --cwd packages/registry check

      - name: Typecheck packages
        run: bun run --filter '@kernelui-lib/*' typecheck

      - name: Test React package
        run: bun run --cwd packages/react test

      - name: Test CLI package
        run: bun run --cwd packages/cli test

      - name: Typecheck docs
        run: bun run --cwd apps/docs typecheck

      - name: Build docs
        if: github.event_name == 'pull_request'
        run: bun run docs:build
