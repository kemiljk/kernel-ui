name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Production deploys are handled by Vercel (see vercel.json). This workflow
# only verifies code quality. Docs are built here on pull requests so merges
# are validated without duplicating the production build Vercel runs on push.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require Changeset for package changes
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-changeset.mjs

      - name: Build packages
        run: bun run --filter '@kernelui-lib/*' build

      - name: Check published package contents
        run: bun run test:package

      # Gzip and brotli size of every package's shipped entry files against
      # scripts/size-budgets.json (~10% headroom). Raise a budget with
      # `node scripts/check-size.mjs --update` and say why in the PR.
      - name: Bundle-size budget
        run: bun run test:size

      - name: Build registry
        run: bun run --cwd packages/registry build

      - name: Registry consistency check
        run: bun run --cwd packages/registry check

      - name: Typecheck packages
        run: bun run --filter '@kernelui-lib/*' typecheck

      - name: Check published styles contain no brand fonts
        run: bun run test:styles-package

      - name: Inline SVG size check
        run: bun run test:svg

      - name: Colour contrast (APCA and WCAG 2)
        run: bun run test:contrast

      # AGENTS.md lists this as required before calling a component done,
      # but CI never ran it, so a container radius without its paired
      # padding (or a pointer cursor without user-select: none) could merge.
      - name: Shape pairing and select-none check
        run: bun run test:shape

      # Physical direction without an RTL pair, black-alpha hovers, and
      # literal durations/easings instead of motion tokens.
      - name: CSS conventions (RTL, hover colour, motion tokens)
        run: bun run test:css

      - name: Component parity (React and elements)
        run: bun run test:parity

      - name: Test React package
        run: bun run --cwd packages/react test

      - name: Test CLI package
        run: bun run --cwd packages/cli test

      - name: Test ESLint plugin
        run: bun run --cwd packages/eslint-plugin test

      - name: Typecheck docs
        run: bun run --cwd apps/docs typecheck

      - name: Build docs
        if: github.event_name == 'pull_request'
        run: bun run docs:build

      # axe-core in a real browser against every component's live examples,
      # light and dark. Fails on serious or critical violations.
      - name: Install Chromium for the accessibility check
        if: github.event_name == 'pull_request'
        run: bunx playwright install --with-deps chromium

      - name: Accessibility check (axe)
        if: github.event_name == 'pull_request'
        run: bun run test:a11y
