name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # Approve the Version Packages PR's CI run. github-actions[bot] is not a
  # collaborator, so a repo set to require approval for all outside
  # contributors creates that pull_request run as action_required and the
  # required review can never see a finished verify job.
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # registry-url writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and does not set NODE_AUTH_TOKEN. npm >= 11.5.1 exchanges the GitHub
      # OIDC token before it reads that placeholder, then uses the exchanged
      # credential. Leave the placeholder in place.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Node 24.22 ships npm 11.19.1, which already meets the 11.5.1 floor for
      # trusted publishing. Install npm@latest only when the bundled CLI is
      # older, so a release does not move onto a new npm major unless the
      # OIDC exchange is missing.
      - name: Ensure npm CLI supports trusted publishing
        run: |
          node <<'EOF'
          const { execFileSync } = require("node:child_process");

          function supportsTrustedPublishing(version) {
            const [major, minor, patch] = version.trim().split(".").map(Number);
            return major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          }

          let version = execFileSync("npm", ["--version"], { encoding: "utf8" });
          if (!supportsTrustedPublishing(version)) {
            console.log(`npm ${version.trim()} is below 11.5.1; installing npm@latest`);
            execFileSync("npm", ["install", "-g", "npm@latest"], { stdio: "inherit" });
            version = execFileSync("npm", ["--version"], { encoding: "utf8" });
          }
          if (!supportsTrustedPublishing(version)) {
            console.error(`npm ${version.trim()} is below 11.5.1, which trusted publishing requires`);
            process.exit(1);
          }
          console.log(`npm ${version.trim()} supports trusted publishing`);
          EOF

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          pr-title: Version Packages
          commit-message: Version Packages
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do not set NPM_TOKEN or NODE_AUTH_TOKEN. The previous secret was
          # expired, and npm would send it instead of completing a failed
          # OIDC exchange.
          NPM_CONFIG_PROVENANCE: true

      # changesets/action pushes changeset-release/main with GITHUB_TOKEN, so
      # the pull_request CI run is attributed to github-actions[bot]. When the
      # repo requires approval for outside collaborators, that run is created
      # already completed with conclusion action_required and zero jobs, and
      # the Version Packages PR stays blocked. This job caused the push, and
      # actions: write lets it approve that one CI run. It never approves a
      # run on any other branch.
      - name: Approve CI for the Version Packages pull request
        if: steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/approve-release-pr-ci.mjs
